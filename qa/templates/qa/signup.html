{% extends "qa/base.html" %}

{% block title %}DocuMind — Sign up{% endblock %}

{% block content %}
    <h1>Sign up</h1>
    <p class="subtitle">Create an account to start uploading documents.</p>

    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign up</button>
        </form>
    </div>

    <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
