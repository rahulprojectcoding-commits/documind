{% extends "qa/base.html" %}

{% block title %}DocuMind — Password updated{% endblock %}

{% block content %}
<section class="auth-standard">
    <span class="eyebrow auth-eyebrow">ALL SET</span>
    <h1>Your password has been updated</h1>
    <p class="subtitle">You can now log in with your new password. Email OTP verification will still be required.</p>
    <a class="btn" href="{% url 'login' %}">Return to log in <span aria-hidden="true">→</span></a>
</section>
{% endblock %}
