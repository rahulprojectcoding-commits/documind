<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DocuMind{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'qa/style.css' %}">
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a href="{% url 'upload' %}" class="brand">DocuMind</a>
            <div style="display:flex;align-items:center;gap:14px;">
                <button id="theme-toggle" type="button" style="background:none;border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--text);font-size:0.85rem;">🌓</button>
                {% if request.user.is_authenticated %}
                    <div class="session">
                        {{ request.user.username }}
                        <form method="post" action="{% url 'logout' %}" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" style="background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font:inherit;text-decoration:underline;">Log out</button>
                        </form>
                    </div>
                {% endif %}
            </div>
        </div>

        {% block content %}{% endblock %}
    </div>
    <script src="https://unpkg.com/htmx.org@2.0.9"></script>
    <script>
  const toggleBtn = document.getElementById('theme-toggle');
  const root = document.documentElement;

  const saved = localStorage.getItem('theme');
  if (saved === 'dark') {
    root.setAttribute('data-theme', 'dark');
  }

  toggleBtn.addEventListener('click', () => {
    const isDark = root.getAttribute('data-theme') === 'dark';
    if (isDark) {
      root.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
    } else {
      root.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    }
  });
</script>
</body>
</html>
