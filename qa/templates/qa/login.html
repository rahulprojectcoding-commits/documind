{% extends "qa/base.html" %}

{% block title %}DocuMind — Log in{% endblock %}

{% block content %}
    <h1>Log in</h1>
    <p class="subtitle">Welcome back.</p>

    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Log in</button>
        </form>
    </div>

    <p class="auth-switch">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
