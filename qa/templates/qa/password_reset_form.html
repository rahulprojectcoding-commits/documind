{% extends "qa/base.html" %}

{% block title %}DocuMind — Reset password{% endblock %}

{% block content %}
<section class="auth-standard">
    <span class="eyebrow auth-eyebrow">ACCOUNT RECOVERY</span>
    <h1>Reset your password</h1>
    <p class="subtitle">Enter the email address on your account and we’ll send you a reset link.</p>
    <div class="card auth-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="primary-button">Send reset link <span aria-hidden="true">→</span></button>
        </form>
    </div>
    <p class="auth-switch"><a href="{% url 'login' %}">← Back to log in</a></p>
</section>
{% endblock %}
